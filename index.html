<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Продюсерский органайзер</title>
<style>
  :root { --bg:#0c0c0e; --fg:#f5f5f7; --muted:#9a9aa2; --card:#18181c; --line:#2c2c32; --red:#ff3b30; --green:#30d158; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  #app { max-width:960px; margin:0 auto; padding:20px; }

  button { font-family:inherit; cursor:pointer; }
  input, textarea { font-family:inherit; color:var(--fg); }

  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .topbar .title { font-size:20px; font-weight:700; flex:1; }
  .btn { border:none; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:600; }
  .btn-back { background:var(--card); color:var(--fg); }
  .btn-add { background:var(--red); color:#fff; }
  .btn-ghost { background:var(--card); color:var(--muted); }
  .btn-del { background:transparent; color:var(--muted); font-size:18px; line-height:1; padding:4px 8px; border-radius:8px; }
  .btn-del:hover { background:#2a2a2e; color:var(--red); }

  /* Клиенты */
  .clist { display:flex; flex-direction:column; gap:10px; }
  .ccard { display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; cursor:pointer; }
  .ccard:hover { border-color:#3a3a42; }
  .ccard .name { font-size:17px; font-weight:600; }
  .ccard .count { font-size:13px; color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:32px 0; font-size:14px; }

  /* Переключатель верт/гориз */
  .toggle { display:flex; border-radius:12px; overflow:hidden; border:1px solid var(--line); margin-bottom:14px; }
  .toggle button { flex:1; padding:11px; background:var(--card); color:var(--muted); border:none; font-size:15px; font-weight:600; }
  .toggle button.on-v { background:var(--green); color:#04120a; }
  .toggle button.on-h { background:var(--red); color:#fff; }

  /* Сетка роликов */
  .vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .vcard { display:flex; flex-direction:column; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; min-height:86px; }
  .vcard:hover { border-color:#3a3a42; }
  .vt-row { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .vcard .vt { font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rbtn { flex:none; background:transparent; border:none; color:var(--muted); font-size:15px; padding:2px 6px; border-radius:6px; }
  .rbtn:hover { color:var(--fg); background:#2a2a2e; }
  .badge { align-self:flex-start; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
  .badge-v { background:rgba(48,209,88,.18); color:var(--green); }
  .badge-h { background:rgba(255,59,48,.18); color:var(--red); }
  .grow { display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  .gcount { font-size:13px; color:var(--muted); }
  .checks { display:flex; gap:14px; margin-top:auto; }
  .chk { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); cursor:pointer; }
  .chk input { width:15px; height:15px; cursor:pointer; }
  .chk.done input { accent-color:var(--green); }
  .chk.pub input { accent-color:var(--red); }
  .chk input:checked ~ span { font-weight:600; }
  .chk.done input:checked ~ span { color:var(--green); }
  .chk.pub input:checked ~ span { color:var(--red); }

  /* Ролик */
  .plot-box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .plot-box label { display:block; font-size:12px; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px; }
  .plot-box textarea { width:100%; background:transparent; border:none; outline:none; resize:vertical; font-size:16px; line-height:1.5; min-height:56px; }

  .tabs { display:flex; border-radius:12px; overflow:hidden; border:1px solid var(--line); margin-bottom:14px; }
  .tabs button { flex:1; padding:11px; background:var(--card); color:var(--muted); border:none; font-size:15px; font-weight:600; }
  .tabs button.on { background:var(--red); color:#fff; }

  /* Таблица сценария */
  .script-table { width:100%; border-collapse:collapse; }
  .script-table th { text-align:left; font-size:12px; color:var(--muted); padding:8px 6px; border-bottom:1px solid var(--line); font-weight:600; }
  .script-table td { padding:6px; border-bottom:1px solid #202024; vertical-align:middle; }
  .script-table .num { color:var(--muted); font-size:13px; width:30px; text-align:center; }
  .script-table input { width:100%; background:#101014; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:14px; outline:none; }
  .script-table input:focus { border-color:var(--red); }
  .script-table .c-del { width:34px; text-align:center; }

  /* Раскадровка */
  .story-list { display:flex; flex-direction:column; gap:12px; }
  .story-item { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .story-head { display:flex; align-items:center; justify-content:space-between; cursor:pointer; margin-bottom:8px; }
  .story-item.collapsed .story-head { margin-bottom:0; }
  .story-num { font-size:13px; color:var(--muted); font-weight:600; }
  .story-num .chev { display:inline-block; width:12px; }
  .story-body { display:block; }
  .story-item.collapsed .story-body { display:none; }
  .story-item input { width:100%; background:transparent; border:none; outline:none; font-size:15px; padding:6px 0; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .story-img-wrap { position:relative; }
  .story-img-wrap img { display:block; width:100%; height:auto; border-radius:10px; background:#101014; cursor:zoom-in; }
  .story-img-wrap .rm { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.72); color:#fff; border:none; border-radius:8px; padding:5px 10px; font-size:12px; font-weight:600; }
  .add-img { width:100%; background:#101014; border:1px dashed #3a3a42; color:var(--muted); border-radius:10px; padding:12px; font-size:14px; font-weight:600; margin-top:8px; }
  .add-img:hover { color:var(--fg); border-color:#55555e; }

  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; cursor:zoom-out; }
  #lightbox img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }

  .add-row { margin-top:12px; width:100%; background:#101014; border:1px dashed #3a3a42; color:var(--muted); border-radius:10px; padding:11px; font-size:14px; font-weight:600; }
  .add-row:hover { color:var(--fg); border-color:#55555e; }

  .title.clickable { cursor:pointer; }
  .title.clickable:hover { text-decoration:underline; }

  .scard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:8px; }
  .scard-head { display:flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:6px; }
  .scard.collapsed .scard-head { margin-bottom:0; }
  .scard-num { font-size:13px; color:var(--muted); font-weight:600; flex:none; }
  .scard-num .chev { display:inline-block; width:12px; color:var(--muted); }
  .scard-summary { flex:1; font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scard-body { display:block; }
  .scard.collapsed .scard-body { display:none; }
  .scard-row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .scard label { display:block; font-size:11px; color:var(--muted); margin:6px 0 3px; }
  .scard input, .scard textarea { width:100%; background:#101014; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; line-height:1.4; outline:none; resize:vertical; }
  .scard input:focus, .scard textarea:focus { border-color:var(--red); }

  .save-hint { margin-top:16px; text-align:center; color:var(--muted); font-size:12px; }

  .footer { margin-top:28px; display:flex; gap:10px; justify-content:center; }
  .footer .btn { font-size:13px; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-box { background:#1a1a1e; border:1px solid var(--line); border-radius:16px; padding:20px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:14px; }
  .modal-title { font-size:17px; font-weight:700; }
  .modal-msg { font-size:14px; color:var(--muted); line-height:1.5; }
  .modal-box input { background:#101014; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:16px; outline:none; color:var(--fg); }
  .modal-box input:focus { border-color:var(--red); }
  .modal-btns { display:flex; gap:10px; justify-content:flex-end; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg" id="modalMsg" style="display:none;"></div>
    <input id="modalInput" type="text" style="display:none;">
    <div class="modal-btns">
      <button id="modalCancel" class="btn btn-ghost">Отмена</button>
      <button id="modalOk" class="btn btn-add">OK</button>
    </div>
  </div>
</div>
<input type="file" id="importInput" accept=".json" style="display:none">
<input type="file" id="imgInput" accept="image/*" style="display:none">
<div id="lightbox" style="display:none;"><img id="lightboxImg" src="" alt=""></div>
<script>
(function () {
  var STORAGE_KEY = 'producer-space-v1';
  var app = document.getElementById('app');
  var importInput = document.getElementById('importInput');
  var modal = document.getElementById('modal');
  var modalTitle = document.getElementById('modalTitle');
  var modalMsg = document.getElementById('modalMsg');
  var modalInput = document.getElementById('modalInput');
  var modalOk = document.getElementById('modalOk');
  var modalCancel = document.getElementById('modalCancel');
  var modalCb = null;
  var imgInput = document.getElementById('imgInput');
  var pendingImage = null;
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');

  function empty() { return { clients: [], groups: [], videos: [] }; }
  function load() {
    var s;
    try { s = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { s = null; }
    if (!s || !s.clients) return empty();
    s.groups = s.groups || [];
    s.videos.forEach(function (v) {
      if (!v.groupId) {
        var g = s.groups.filter(function (g) { return g.clientId === v.clientId; })[0];
        if (!g) { g = { id: uid(), clientId: v.clientId, name: 'Общее' }; s.groups.push(g); }
        v.groupId = g.id;
      }
    });
    return s;
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function findClient(id) { return state.clients.filter(function (c) { return c.id === id; })[0]; }
  function findVideo(id) { return state.videos.filter(function (v) { return v.id === id; })[0]; }
  function findGroup(id) { return state.groups.filter(function (g) { return g.id === id; })[0]; }

  function showModal(opts) {
    modalTitle.textContent = opts.title || '';
    modalMsg.style.display = opts.msg ? 'block' : 'none';
    modalMsg.textContent = opts.msg || '';
    modalInput.style.display = opts.input ? 'block' : 'none';
    modalInput.value = opts.value || '';
    modalInput.placeholder = opts.placeholder || '';
    modalCancel.style.display = (opts.cancelable === false) ? 'none' : 'inline-block';
    modalOk.textContent = opts.okLabel || 'OK';
    modalCb = opts.onOk || null;
    modal.style.display = 'flex';
    if (opts.input) modalInput.focus();
  }
  function hideModal() { modal.style.display = 'none'; modalCb = null; }

  modalOk.addEventListener('click', function () {
    var cb = modalCb, val = modalInput.value;
    hideModal();
    if (cb) cb(val);
  });
  modalCancel.addEventListener('click', hideModal);
  modalInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') modalOk.click();
    else if (e.key === 'Escape') hideModal();
  });
  lightbox.addEventListener('click', function () { lightbox.style.display = 'none'; });

  var state = load();
  var route = { screen: 'home' };
  var currentOrientation = 'v';
  var currentTab = 'script';

  function render() {
    if (route.screen === 'home') renderHome();
    else if (route.screen === 'client') renderClient();
    else if (route.screen === 'group') renderGroup();
    else if (route.screen === 'video') renderVideo();
  }

  function renderHome() {
    var h = '<div class="topbar"><div class="title">Мои клиенты</div><button class="btn btn-add" data-action="addClient">+ клиент</button></div>';
    if (!state.clients.length) {
      h += '<div class="empty">Пока нет клиентов. Нажми «+ клиент».</div>';
    } else {
      h += '<div class="clist">';
      state.clients.forEach(function (c) {
        var vids = state.videos.filter(function (v) { return v.clientId === c.id; }).length;
        h += '<div class="ccard" data-action="openClient" data-id="' + c.id + '">'
          + '<span class="name">' + esc(c.name) + '</span>'
          + '<span class="count">роликов: ' + vids + '</span>'
          + '</div>';
      });
      h += '</div>';
    }
    h += '<div class="footer"><button class="btn btn-ghost" data-action="exportData">Сохранить в файл</button><button class="btn btn-ghost" data-action="importData">Загрузить из файла</button></div>';
    app.innerHTML = h;
  }

  function renderClient() {
    var c = findClient(route.clientId);
    if (!c) { route = { screen: 'home' }; render(); return; }
    var h = '<div class="topbar"><button class="btn btn-back" data-action="backHome">← Назад</button><div class="title">' + esc(c.name) + '</div><button class="btn btn-add" data-action="addGroup">+ группа</button></div>';
    var groups = state.groups.filter(function (g) { return g.clientId === c.id; });
    if (!groups.length) {
      h += '<div class="empty">Пока нет групп. Нажми «+ группа».</div>';
    } else {
      h += '<div class="vgrid">';
      groups.forEach(function (g) {
        var count = state.videos.filter(function (v) { return v.groupId === g.id; }).length;
        h += '<div class="vcard groupcard" data-action="openGroup" data-id="' + g.id + '">'
          + '<div class="vt-row"><span class="vt">' + esc(g.name) + '</span><button class="rbtn" data-action="renameGroupInline" data-id="' + g.id + '" title="Переименовать">✎</button></div>'
          + '<div class="grow"><span class="gcount">роликов: ' + count + '</span><button class="btn-del" data-action="deleteGroup" data-id="' + g.id + '" title="Удалить группу">✕</button></div>'
          + '</div>';
      });
      h += '</div>';
    }
    app.innerHTML = h;
  }

  function renderGroup() {
    var g = findGroup(route.groupId);
    if (!g) { route = { screen: 'home' }; render(); return; }
    var h = '<div class="topbar"><button class="btn btn-back" data-action="backClient">← Назад</button><div class="title">' + esc(g.name) + '</div><button class="btn btn-add" data-action="addVideo">+ ролик</button></div>';
    h += '<div class="toggle">'
      + '<button class="' + (currentOrientation === 'v' ? 'on-v' : '') + '" data-action="setOrient" data-o="v">Вертикальные</button>'
      + '<button class="' + (currentOrientation === 'h' ? 'on-h' : '') + '" data-action="setOrient" data-o="h">Горизонтальные</button>'
      + '</div>';
    var vids = state.videos.filter(function (v) { return v.groupId === g.id && v.orientation === currentOrientation; });
    if (!vids.length) {
      h += '<div class="empty">Пока нет ' + (currentOrientation === 'v' ? 'вертикальных' : 'горизонтальных') + ' роликов. Нажми «+ ролик».</div>';
    } else {
      h += '<div class="vgrid">';
      vids.forEach(function (v) {
        h += '<div class="vcard" data-action="openVideo" data-id="' + v.id + '">'
          + '<div class="vt-row"><span class="vt">' + esc(v.title || 'Без названия') + '</span><button class="rbtn" data-action="renameVideoInline" data-id="' + v.id + '" title="Переименовать">✎</button></div>'
          + '<div class="checks">'
          + '<label class="chk done" title="Сделан"><input type="checkbox" data-bind="done" data-id="' + v.id + '"' + (v.done ? ' checked' : '') + '><span>сделан</span></label>'
          + '<label class="chk pub" title="Выложен"><input type="checkbox" data-bind="published" data-id="' + v.id + '"' + (v.published ? ' checked' : '') + '><span>выложен</span></label>'
          + '</div>'
          + '</div>';
      });
      h += '</div>';
    }
    app.innerHTML = h;
  }

  function renderVideo() {
    var v = findVideo(route.videoId);
    if (!v) { route = { screen: 'home' }; render(); return; }
    var h = '<div class="topbar"><button class="btn btn-back" data-action="backGroup">← Назад</button><div class="title clickable" data-action="renameVideo" title="Переименовать">' + esc(v.title || 'Без названия') + '</div><button class="btn btn-del" data-action="deleteVideo" title="Удалить ролик">✕</button></div>';

    h += '<div class="plot-box"><label>Сюжет</label><textarea data-bind="plot" data-id="' + v.id + '" placeholder="О чём ролик в двух словах…">' + esc(v.plot || '') + '</textarea></div>';

    h += '<div class="tabs">'
      + '<button class="' + (currentTab === 'script' ? 'on' : '') + '" data-action="setTab" data-t="script">Сценарий</button>'
      + '<button class="' + (currentTab === 'story' ? 'on' : '') + '" data-action="setTab" data-t="story">Раскадровка</button>'
      + '</div>';

    if (currentTab === 'script') {
      h += '<div class="script-cards">';
      (v.script || []).forEach(function (row, i) {
        h += '<div class="scard' + (row.collapsed ? ' collapsed' : '') + '">'
          + '<div class="scard-head" data-action="toggleScript" data-id="' + v.id + '" data-row="' + row.id + '">'
          + '<span class="scard-num"><span class="chev">' + (row.collapsed ? '▸' : '▾') + '</span> Кадр ' + (i + 1) + '</span>'
          + '<button class="btn-del" data-action="delScriptRow" data-id="' + v.id + '" data-row="' + row.id + '">✕</button>'
          + '</div>'
          + '<div class="scard-body">'
          + '<div class="scard-row2"><div><label>Локация</label><input data-bind="sf" data-id="' + v.id + '" data-row="' + row.id + '" data-field="location" value="' + esc(row.location) + '"></div><div><label>План</label><input data-bind="sf" data-id="' + v.id + '" data-row="' + row.id + '" data-field="shot" value="' + esc(row.shot) + '"></div></div>'
          + '<label>Что в кадре</label><textarea data-bind="sf" data-id="' + v.id + '" data-row="' + row.id + '" data-field="inFrame" rows="2">' + esc(row.inFrame) + '</textarea>'
          + '<label>Звук / реплики</label><textarea data-bind="sf" data-id="' + v.id + '" data-row="' + row.id + '" data-field="sound" rows="2">' + esc(row.sound) + '</textarea>'
          + '</div>'
          + '</div>';
      });
      h += '</div>';
      h += '<button class="add-row" data-action="addScriptRow" data-id="' + v.id + '">+ добавить кадр</button>';
    } else {
      h += '<div class="story-list">';
      (v.storyboard || []).forEach(function (item, i) {
        h += '<div class="story-item' + (item.collapsed ? ' collapsed' : '') + '">'
          + '<div class="story-head" data-action="toggleStory" data-id="' + v.id + '" data-row="' + item.id + '">'
          + '<span class="story-num"><span class="chev">' + (item.collapsed ? '▸' : '▾') + '</span> Кадр ' + (i + 1) + '</span>'
          + '<button class="btn-del" data-action="delStory" data-id="' + v.id + '" data-row="' + item.id + '">✕</button>'
          + '</div>'
          + '<div class="story-body">'
          + '<input data-bind="st" data-id="' + v.id + '" data-row="' + item.id + '" value="' + esc(item.text) + '" placeholder="Описание кадра…">'
          + (item.img
              ? '<div class="story-img-wrap"><img src="' + item.img + '" data-action="openImg"><button class="rm" data-action="delStoryImg" data-id="' + v.id + '" data-row="' + item.id + '">убрать фото</button></div>'
              : '<button class="add-img" data-action="addStoryImg" data-id="' + v.id + '" data-row="' + item.id + '">＋ фото</button>')
          + '</div>'
          + '</div>';
      });
      h += '</div>';
      h += '<button class="add-row" data-action="addStory" data-id="' + v.id + '">+ добавить кадр</button>';
    }

    h += '<div class="save-hint">Всё сохраняется автоматически · назад — «← Назад»</div>';
    app.innerHTML = h;
  }

  // --- события ---
  app.addEventListener('click', function (e) {
    if (e.target.closest('label.chk')) return;
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var a = btn.dataset.action;

    if (a === 'addClient') {
      showModal({ title: 'Новый клиент', input: true, placeholder: 'Имя клиента', okLabel: 'Добавить', onOk: function (name) {
        name = (name || '').trim();
        if (!name) return;
        state.clients.push({ id: uid(), name: name });
        save(); render();
      }});
    }
    else if (a === 'openClient') { route = { screen: 'client', clientId: btn.dataset.id }; render(); }
    else if (a === 'backHome') { route = { screen: 'home' }; render(); }
    else if (a === 'setOrient') { currentOrientation = btn.dataset.o; render(); }
    else if (a === 'addGroup') {
      showModal({ title: 'Новая группа', input: true, placeholder: 'Название (объект, тема…)', okLabel: 'Добавить', onOk: function (name) {
        name = (name || '').trim();
        if (!name) return;
        state.groups.push({ id: uid(), clientId: route.clientId, name: name });
        save(); render();
      }});
    }
    else if (a === 'openGroup') { route = { screen: 'group', clientId: route.clientId, groupId: btn.dataset.id }; render(); }
    else if (a === 'renameGroupInline') {
      var g = findGroup(btn.dataset.id);
      showModal({ title: 'Название группы', input: true, value: g.name, okLabel: 'Сохранить', onOk: function (t) {
        t = (t || '').trim();
        if (!t) return;
        g.name = t; save(); render();
      }});
    }
    else if (a === 'deleteGroup') {
      var g = findGroup(btn.dataset.id);
      showModal({ title: 'Удалить группу?', msg: 'Группа «' + g.name + '» и все ролики в ней будут удалены.', okLabel: 'Удалить', onOk: function () {
        state.videos = state.videos.filter(function (v) { return v.groupId !== g.id; });
        state.groups = state.groups.filter(function (x) { return x.id !== g.id; });
        save(); render();
      }});
    }
    else if (a === 'addVideo') {
      var g = findGroup(route.groupId);
      if (!g) return;
      var nums = state.videos.filter(function (v) { return v.groupId === g.id; })
        .map(function (v) { return parseInt(v.title, 10); })
        .filter(function (n) { return !isNaN(n); });
      var next = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
      state.videos.push({ id: uid(), clientId: g.clientId, groupId: g.id, title: String(next), orientation: currentOrientation, plot: '', script: [], storyboard: [] });
      save(); render();
    }
    else if (a === 'openVideo') { route = { screen: 'video', videoId: btn.dataset.id }; currentTab = 'script'; render(); }
    else if (a === 'backClient') { route = { screen: 'client', clientId: route.clientId }; render(); }
    else if (a === 'backGroup') {
      var v = findVideo(route.videoId);
      route = { screen: 'group', clientId: v.clientId, groupId: v.groupId };
      render();
    }
    else if (a === 'deleteVideo') {
      var v = findVideo(route.videoId);
      showModal({ title: 'Удалить ролик?', msg: '«' + v.title + '» будет удалён.', okLabel: 'Удалить', onOk: function () {
        state.videos = state.videos.filter(function (x) { return x.id !== v.id; });
        save(); route = { screen: 'group', clientId: v.clientId, groupId: v.groupId }; render();
      }});
    }
    else if (a === 'renameVideo') {
      var v = findVideo(route.videoId);
      showModal({ title: 'Название ролика', input: true, value: v.title, okLabel: 'Сохранить', onOk: function (t) {
        t = (t || '').trim();
        if (!t) return;
        v.title = t; save(); render();
      }});
    }
    else if (a === 'renameVideoInline') {
      var v = findVideo(btn.dataset.id);
      showModal({ title: 'Название ролика', input: true, value: v.title, okLabel: 'Сохранить', onOk: function (t) {
        t = (t || '').trim();
        if (!t) return;
        v.title = t; save(); render();
      }});
    }
    else if (a === 'setTab') { currentTab = btn.dataset.t; render(); }
    else if (a === 'addScriptRow') {
      var v = findVideo(btn.dataset.id);
      v.script = v.script || [];
      v.script.push({ id: uid(), location: '', shot: '', inFrame: '', sound: '' });
      save(); render();
    }
    else if (a === 'delScriptRow') {
      var v = findVideo(btn.dataset.id);
      v.script = v.script.filter(function (r) { return r.id !== btn.dataset.row; });
      save(); render();
    }
    else if (a === 'toggleScript') {
      var v = findVideo(btn.dataset.id);
      var row = v.script.filter(function (r) { return r.id === btn.dataset.row; })[0];
      if (!row) return;
      row.collapsed = !row.collapsed;
      var card = btn.closest('.scard');
      if (card) {
        card.classList.toggle('collapsed', row.collapsed);
        var chev = card.querySelector('.chev');
        if (chev) chev.textContent = row.collapsed ? '▸' : '▾';
      }
      save();
    }
    else if (a === 'addStory') {
      var v = findVideo(btn.dataset.id);
      v.storyboard = v.storyboard || [];
      v.storyboard.push({ id: uid(), text: '', img: '' });
      save(); render();
    }
    else if (a === 'delStory') {
      var v = findVideo(btn.dataset.id);
      v.storyboard = v.storyboard.filter(function (r) { return r.id !== btn.dataset.row; });
      save(); render();
    }
    else if (a === 'addStoryImg') {
      pendingImage = { videoId: btn.dataset.id, rowId: btn.dataset.row };
      imgInput.click();
    }
    else if (a === 'delStoryImg') {
      var v = findVideo(btn.dataset.id);
      var row = v.storyboard.filter(function (r) { return r.id === btn.dataset.row; })[0];
      if (row) { row.img = ''; save(); render(); }
    }
    else if (a === 'toggleStory') {
      var v = findVideo(btn.dataset.id);
      var row = v.storyboard.filter(function (r) { return r.id === btn.dataset.row; })[0];
      if (!row) return;
      row.collapsed = !row.collapsed;
      var card = btn.closest('.story-item');
      if (card) {
        card.classList.toggle('collapsed', row.collapsed);
        var chev = card.querySelector('.chev');
        if (chev) chev.textContent = row.collapsed ? '▸' : '▾';
      }
      save();
    }
    else if (a === 'openImg') {
      lightboxImg.src = btn.src;
      lightbox.style.display = 'flex';
    }
    else if (a === 'exportData') {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'producer-space.json';
      link.click();
      URL.revokeObjectURL(link.href);
    }
    else if (a === 'importData') { importInput.click(); }
  });

  app.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.bind === 'plot') {
      var v = findVideo(el.dataset.id); v.plot = el.value; save();
    }
    else if (el.dataset.bind === 'sf') {
      var v = findVideo(el.dataset.id);
      var row = v.script.filter(function (r) { return r.id === el.dataset.row; })[0];
      if (row) { row[el.dataset.field] = el.value; save(); }
    }
    else if (el.dataset.bind === 'st') {
      var v = findVideo(el.dataset.id);
      var row = v.storyboard.filter(function (r) { return r.id === el.dataset.row; })[0];
      if (row) { row.text = el.value; save(); }
    }
  });

  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el.tagName !== 'INPUT' || el.type !== 'checkbox') return;
    var v = findVideo(el.dataset.id);
    if (!v) return;
    if (el.dataset.bind === 'done') v.done = el.checked;
    else if (el.dataset.bind === 'published') v.published = el.checked;
    save();
  });

  importInput.addEventListener('change', function () {
    var file = importInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var s = JSON.parse(reader.result);
        if (s && s.clients) { state = s; save(); render(); }
        else showModal({ title: 'Ошибка', msg: 'Не похоже на файл органайзера.', cancelable: false });
      } catch (err) { showModal({ title: 'Ошибка', msg: 'Не удалось прочитать файл.', cancelable: false }); }
    };
    reader.readAsText(file);
    importInput.value = '';
  });

  imgInput.addEventListener('change', function () {
    var file = imgInput.files[0];
    var target = pendingImage;
    pendingImage = null;
    imgInput.value = '';
    if (!file || !target) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas');
        var maxW = 1280;
        var scale = Math.min(1, maxW / img.width);
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        var v = findVideo(target.videoId);
        var row = v.storyboard.filter(function (r) { return r.id === target.rowId; })[0];
        if (row) { row.img = dataUrl; save(); render(); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  render();
})();
</script>
</body>
</html>
